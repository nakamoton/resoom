<html>
<head><title>公共施設予約システム（施設絞り込み（場所選択））</title></head>

<tr class="btn_table" tabindex="0" title="サンプル会館リハーサル室を選択">

</tr>
<tr class="btn_table" tabindex="0" title="サンプル会館第一音楽スタジオを選択">

</tr>
</tbody>
</table>

</body>
</html>
